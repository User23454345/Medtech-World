name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wöchentlich montags 04:17 UTC: externe Quellen-URLs prüfen
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Inhalte, Typen, Tests, Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Qualitätsprüfung der Inhalte
        run: npm run content:check

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Frontend-Build
        run: npm run build

  links:
    name: Externe Quellen-URLs prüfen
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Inhalte inkl. externer Links prüfen
        run: npm run content:check:links
